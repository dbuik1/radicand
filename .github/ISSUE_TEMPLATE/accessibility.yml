name: Accessibility problem
description: Something is hard or impossible to use with a screen reader, the keyboard, magnification or another assistive technology.
labels: [accessibility]
body:
  - type: markdown
    attributes:
      value: |
        Thank you – reports from people who use assistive technology are the most valuable ones this project gets, because an automated audit cannot hear what a screen reader says.
  - type: textarea
    id: task
    attributes:
      label: What were you trying to do?
      placeholder: Insert a fraction from the symbol palette.
    validations:
      required: true
  - type: textarea
    id: barrier
    attributes:
      label: What got in the way?
      description: What you heard, saw or could not reach. Exact announcements help a lot.
    validations:
      required: true
  - type: input
    id: at
    attributes:
      label: Assistive technology and version
      placeholder: NVDA 2024.4, keyboard only, ZoomText 2025, Windows High Contrast
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
      description: Shown on chrome://extensions under Radicand.
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Chrome 131 on Windows 11
    validations:
      required: true
