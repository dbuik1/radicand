name: Feature request
description: Suggest something the editor could do.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What are you trying to do?
      description: The task you have in mind, rather than the feature – for example "paste equations into Google Docs as images".
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: What you use now, and where it falls short.
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: Your idea for how the editor could do it. Please say how it would work from the keyboard.
