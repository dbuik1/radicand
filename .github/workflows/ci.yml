name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Type-check, unit tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:notes
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  browser:
    name: Browser suites (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Each suite runs even when an earlier one fails, so one run shows them all.
      - name: End-to-end
        run: npm run test:e2e
      - name: Extension smoke test
        if: ${{ !cancelled() }}
        run: npm run test:ext
        env:
          EXT_SMOKE_SCREENSHOTS: ${{ runner.temp }}
      - name: Accessibility audit
        if: ${{ !cancelled() }}
        run: npm run test:a11y
      - name: Keep failure screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.os }}
          path: ${{ runner.temp }}/ext-smoke-*.png
          if-no-files-found: ignore
