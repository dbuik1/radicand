<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Layout C, one box</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.b{display:flex;gap:40px;width:2140px;height:720px;background:#e6e6e6;font:15px/1.4 system-ui,sans-serif;color:#1f1f1f}
.f{width:400px;height:720px;background:#fff;display:flex;flex-direction:column;overflow:hidden}
.w{width:820px}
.eq{font:38px/1.2 Georgia,'Times New Roman',serif;display:flex;align-items:center}
.fr{display:inline-flex;flex-direction:column;align-items:center;margin:0 8px}
.fr>span:first-child{border-bottom:1.5px solid #1f1f1f;padding:0 6px 3px}
.fr>span:last-child{padding-top:3px}
.ov{border-top:1.5px solid #1f1f1f}
button,input{font:inherit;color:inherit}
.bt{height:44px;padding:0 14px;border:1px solid #b5b5b5;border-radius:6px;background:#fff;white-space:nowrap}
.pr{background:#1f1f1f;border-color:#1f1f1f;color:#fff;font-weight:600}
.in{height:48px;border:1px solid #8a8a8a;border-radius:6px;padding:0 12px;width:100%;box-sizing:border-box;background:#fff}
.k{width:44px;height:44px;border:1px solid #c8c8c8;border-radius:6px;background:#fff;font:19px Georgia,serif;padding:0}
.ks{display:grid;grid-template-columns:repeat(7,44px);gap:8px}
.r{display:flex;gap:8px;align-items:center}
.c{display:flex;flex-direction:column}
.m{color:#5c5c5c}
.s{font-size:13px}
.h{font-weight:600}
.ln{border-top:1px solid #dcdcdc}
.li{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border:0;background:none;text-align:left;width:100%;box-sizing:border-box}
.on.li{background:#ededed}
.li b{font:19px Georgia,serif;width:24px;text-align:center;font-weight:400}
.li code{margin-left:auto;font:12px ui-monospace,monospace;color:#5c5c5c}
.g{flex:1}
.p{padding:16px}
</style>
</helmet>
<div class="b">

<div class="f">
<div class="r p" style="padding-bottom:0"><span class="h g">Equation</span><button class="bt">Menu</button></div>
<div class="g r" style="justify-content:center"><div class="eq"><i>x</i>&nbsp;=&nbsp;<span class="fr"><span>−<i>b</i> ± √<span class="ov"><i>b</i>² − 4<i>ac</i></span></span><span>2<i>a</i></span></span></div></div>
<div class="c p" style="gap:12px">
<input class="in" aria-label="Find anything" placeholder="Find a symbol, equation or command">
<div class="s m">Recent symbols</div>
<div class="ks"><button class="k">½</button><button class="k">√</button><button class="k">xⁿ</button><button class="k">xₙ</button><button class="k">π</button><button class="k">×</button><button class="k">≤</button></div>
</div>
<div class="c p ln"><button class="bt pr">Copy MathML</button></div>
</div>

<div class="f">
<div class="r p" style="padding-bottom:0"><span class="h g">Equation</span><button class="bt">Menu</button></div>
<div class="g r" style="justify-content:center"><div class="eq" style="font-size:30px"><i>c</i>² = <i>a</i>² + <i>b</i>² − 2<i>ab</i> cos</div></div>
<div class="c p" style="gap:4px">
<input class="in" aria-label="Find anything" value="angle" style="border:2px solid #1f1f1f">
<div class="s m" style="margin-top:8px">Symbols</div>
<button class="li on"><b>∠</b>Angle<code>\angle</code></button><button class="li"><b>∡</b>Measured angle<code>\measuredangle</code></button><button class="li"><b>∢</b>Spherical angle<code>\sphericalangle</code></button>
<div class="s m" style="margin-top:8px">Saved equations</div>
<button class="li"><b>∑</b>Angle sum of a triangle</button>
<div class="s m" style="margin-top:8px">Commands</div>
<button class="li"><b>⟨⟩</b>Insert angle brackets</button>
</div>
<div class="c p ln"><button class="bt pr">Copy MathML</button></div>
</div>

<div class="f">
<div class="r p" style="padding-bottom:0"><span class="h g">Equation</span><button class="bt">Menu</button></div>
<div class="g r" style="justify-content:center"><div class="eq"><i>x</i>&nbsp;=&nbsp;<span class="fr"><span>−<i>b</i> ± √<span class="ov"><i>b</i>² − 4<i>ac</i></span></span><span>2<i>a</i></span></span></div></div>
<div class="c p" style="gap:12px">
<input class="in" aria-label="Find anything" placeholder="Find a symbol, equation or command">
<div class="s m">Recent symbols</div>
<div class="ks"><button class="k">½</button><button class="k">√</button><button class="k">xⁿ</button><button class="k">xₙ</button><button class="k">π</button><button class="k">×</button><button class="k">≤</button></div>
</div>
<div class="c p ln" style="gap:8px"><div><span class="h">Copied as MathML.</span> Paste it into your document.</div><div class="r"><button class="bt pr g">Copy MathML</button><button class="bt">Copy LaTeX</button></div></div>
</div>

<div class="f w">
<div class="r p" style="padding-bottom:0"><span class="h g">Equation</span><button class="bt">Menu</button></div>
<div class="g r" style="justify-content:center"><div class="eq" style="font-size:56px"><i>x</i>&nbsp;=&nbsp;<span class="fr"><span>−<i>b</i> ± √<span class="ov"><i>b</i>² − 4<i>ac</i></span></span><span>2<i>a</i></span></span></div></div>
<div class="c p" style="gap:12px;width:560px;align-self:center;box-sizing:border-box">
<input class="in" aria-label="Find anything" placeholder="Find a symbol, equation or command">
<div class="r"><div class="ks"><button class="k">½</button><button class="k">√</button><button class="k">xⁿ</button><button class="k">xₙ</button><button class="k">π</button><button class="k">×</button><button class="k">≤</button></div><span class="g"></span><button class="bt pr">Copy MathML</button></div>
</div>
<div style="height:24px"></div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2140,"height":720}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
