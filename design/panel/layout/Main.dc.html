<style>
body{margin:0}
.b{display:flex;gap:40px;width:2140px;height:720px;background:#e6e6e6;font:15px/1.4 system-ui,sans-serif;color:#1f1f1f}
.f{width:400px;height:720px;background:#fff;display:flex;flex-direction:column;overflow:hidden}
.w{width:820px;flex-direction:row}
.eq{font:34px/1.2 Georgia,'Times New Roman',serif;display:flex;align-items:center}
.fr{display:inline-flex;flex-direction:column;align-items:center;margin:0 8px}
.fr>span:first-child{border-bottom:1.5px solid #1f1f1f;padding:0 6px 3px}
.fr>span:last-child{padding-top:3px}
.ov{border-top:1.5px solid #1f1f1f}
button,input{font:inherit;color:inherit}
.bt{height:44px;padding:0 14px;border:1px solid #b5b5b5;border-radius:6px;background:#fff;white-space:nowrap}
.pr{background:#1f1f1f;border-color:#1f1f1f;color:#fff;font-weight:600}
.in{height:44px;border:1px solid #8a8a8a;border-radius:6px;padding:0 12px;width:100%;box-sizing:border-box;background:#fff}
.k{width:44px;height:44px;border:1px solid #c8c8c8;border-radius:6px;background:#fff;font:19px Georgia,serif;padding:0}
.ks{display:grid;grid-template-columns:repeat(7,44px);gap:8px}
.r{display:flex;gap:8px;align-items:center}
.c{display:flex;flex-direction:column}
.m{color:#5c5c5c}
.s{font-size:13px}
.h{font-weight:600}
.ln{border-top:1px solid #dcdcdc}
.t{background:none;border:0;border-bottom:2px solid transparent;height:44px;padding:0 10px}
.on.t{border-bottom-color:#1f1f1f;font-weight:600}
.li{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border:0;background:none;text-align:left;width:100%;box-sizing:border-box}
.on.li{background:#ededed}
.li b{font:19px Georgia,serif;width:24px;text-align:center;font-weight:400}
.li code{margin-left:auto;font:12px ui-monospace,monospace;color:#5c5c5c}
.g{flex:1}
.st{height:250px;padding:16px;background:#f5f5f5;box-sizing:border-box}
.dk{padding:12px 16px 16px;gap:8px}
</style>
</helmet>

</div>
