<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">

<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.b{display:flex;gap:40px;width:2560px;height:720px;background:#8d8d8d}
.f{font:15px/1.4 var(--ui);width:400px;height:720px;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden;box-sizing:border-box}
.w{width:820px;flex-direction:row}
.top{display:flex;flex-direction:column;gap:12px;padding:16px}
.wl{flex:1}
.side{width:388px;display:flex;flex-direction:column;border-left:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:8px}
.ttl{flex:1;font-weight:700;font-size:18px}
.fd{height:140px;border:1px solid var(--fline);border-radius:var(--r);background:var(--field);padding:0 20px;display:flex;align-items:center;box-sizing:border-box}
.big{flex:1;height:auto;justify-content:center}
.eq{font:34px/1.2 var(--math);display:flex;align-items:center;color:var(--eq)}
.big .eq{font-size:40px}
.eq,.fr span{white-space:nowrap}
.fr{display:inline-flex;flex-direction:column;align-items:center;margin:0 8px}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 6px 3px}
.fr>span:last-child{padding-top:3px}
.ov{border-top:1.5px solid currentColor}
button,input{font:inherit;color:inherit}
.ac{display:flex;gap:8px}
.bt{height:44px;padding:0 12px;border:1px solid var(--bline);border-radius:var(--r);background:var(--btn);color:var(--ink);white-space:nowrap;font-weight:500}
.sm{height:36px}
.pr{flex:1;background:var(--accent);border-color:var(--accent);color:var(--on);font-weight:700}
.in{height:44px;border:1px solid var(--fline);border-radius:var(--r);padding:0 12px;width:100%;box-sizing:border-box;background:var(--field);color:var(--eq)}
.src{font:13px ui-monospace,SFMono-Regular,Menlo,monospace}
.lb{font-weight:600;font-size:14px;margin-bottom:-4px}
.tb{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}
.t{background:none;border:0;border-bottom:3px solid transparent;height:44px;padding:0;color:var(--muted)}
.t.on{border-bottom-color:var(--mark);color:var(--ink);font-weight:700}
.bd{display:flex;flex-direction:column;gap:10px;padding:16px;flex:1}
.cats{display:flex}
.ct{background:none;border:0;border-bottom:2px solid transparent;height:40px;padding:0 10px;color:var(--muted);font-size:14px}
.ct.on{border-bottom-color:var(--ink);color:var(--ink);font-weight:600}
.ks{display:grid;grid-template-columns:repeat(7,44px);gap:8px}
.k{width:44px;height:44px;border:1px solid var(--kline);border-radius:var(--r);background:var(--key);font:19px var(--math);padding:0;color:var(--ink)}
.h{font-weight:600}
.dn{font-size:14px}
.dn .h{color:var(--mark)}
.sv{display:flex;align-items:center;gap:12px;min-height:60px;border-bottom:1px solid var(--line)}
.svt{flex:1}
.mm{font:18px var(--math)}
.ds{border-top:1px solid var(--line);padding:0 16px}
.ds summary{height:48px;display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer;list-style:none}
.ds summary:before{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg)}
.f{--ui:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;--r:0px;--math:"STIX Two Math","Cambria Math",Georgia,serif}
.lt{--bg:#f7f9fb;--ink:#13233a;--muted:#4b5c73;--line:#c5d0dc;--fline:#1f4e8c;--bline:#1f4e8c;--kline:#c5d0dc;--field:#fff;--btn:#fff;--key:#fff;--accent:#1f4e8c;--on:#fff;--eq:#13233a;--mark:#1f4e8c;--grid:#dbe6f2}
.dk{--bg:#0f2440;--ink:#eaf2fb;--muted:#a9bfd8;--line:#2c4a70;--fline:#9cc7ff;--bline:#9cc7ff;--kline:#2c4a70;--field:#0b1c33;--btn:#0f2440;--key:#0f2440;--accent:#9cc7ff;--on:#081a30;--eq:#fff;--mark:#9cc7ff;--grid:#1b3558}
.fd{background-color:var(--field);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:15px 15px;border-width:1.5px}
.ks{gap:0}.k{margin:0 -1px -1px 0;width:45px;height:45px}
.bt{font-weight:600}
</style>
</helmet>
<div class="b">
