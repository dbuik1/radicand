<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>S3 – Graph paper</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.b{display:flex;gap:40px;width:1700px;height:720px;background:var(--canvas);font:15px/1.4 var(--ui);color:var(--ink)}
.f{width:400px;height:720px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;box-sizing:border-box}
.w{width:820px;flex-direction:row}
.top{display:flex;flex-direction:column;gap:12px;padding:16px}
.wl{flex:1}
.side{width:388px;display:flex;flex-direction:column;border-left:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:8px}
.ttl{flex:1;font-weight:600}
.fd{height:150px;border:1px solid var(--fline);border-radius:var(--r);background:var(--field);padding:0 20px;display:flex;align-items:center;box-sizing:border-box}
.big{flex:1;height:auto;justify-content:center}
.eq{font:34px/1.2 var(--math);display:flex;align-items:center;color:var(--eq)}
.big .eq{font-size:40px}
.eq,.fr span{white-space:nowrap}
.fr{display:inline-flex;flex-direction:column;align-items:center;margin:0 8px}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 6px 3px}
.fr>span:last-child{padding-top:3px}
.ov{border-top:1.5px solid currentColor}
button,input{font:inherit;color:inherit}
.ac{display:flex;gap:8px}
.bt{height:44px;padding:0 14px;border:1px solid var(--bline);border-radius:var(--r);background:var(--btn);white-space:nowrap;font-weight:500}
.sm{height:36px}
.pr{flex:1;background:var(--accent);border-color:var(--accent);color:var(--on);font-weight:700}
.in{height:44px;border:1px solid var(--fline);border-radius:var(--r);padding:0 12px;width:100%;box-sizing:border-box;background:var(--field);color:var(--ink)}
.in::placeholder{color:var(--muted);opacity:1}
.src{font:13px ui-monospace,SFMono-Regular,Menlo,monospace}
.lb{font-weight:600}
.tb{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}
.t{background:none;border:0;border-bottom:3px solid transparent;height:44px;padding:0;color:var(--muted)}
.t.on{border-bottom-color:var(--accent);color:var(--ink);font-weight:700}
.bd{display:flex;flex-direction:column;gap:10px;padding:16px;flex:1}
.cats{display:flex}
.ct{background:none;border:0;border-bottom:2px solid transparent;height:40px;padding:0 10px;color:var(--muted);font-size:14px}
.ct.on{border-bottom-color:var(--ink);color:var(--ink);font-weight:600}
.ks{display:grid;grid-template-columns:repeat(7,44px);gap:8px}
.k{width:44px;height:44px;border:1px solid var(--kline);border-radius:var(--r);background:var(--key);font:19px var(--math);padding:0;color:var(--eq)}
.h{font-weight:600}
.dn{font-size:14px}
.sv{display:flex;align-items:center;gap:12px;min-height:60px;border-bottom:1px solid var(--line)}
.svt{flex:1}
.mm{font:18px var(--math)}
.b{--canvas:#cfd6dd;--bg:#f7f9fb;--ink:#13233a;--muted:#4b5c73;--line:#c5d0dc;--fline:#1f4e8c;--bline:#1f4e8c;--kline:#c5d0dc;--field:#fff;--btn:#fff;--key:#fff;--accent:#1f4e8c;--on:#fff;--eq:#13233a;--r:0px;--ui:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;--math:"STIX Two Math","Cambria Math",Georgia,serif}
.fd{background:#fff linear-gradient(#dbe6f2 1px,transparent 1px) 0 0/100% 15px,#fff;background-image:linear-gradient(#dbe6f2 1px,transparent 1px),linear-gradient(90deg,#dbe6f2 1px,transparent 1px);background-size:15px 15px;border-width:1.5px}
.ttl,.t,.ct,.lb{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:13px;text-transform:uppercase;letter-spacing:.08em}
.ks{gap:0}.k{margin:0 -1px -1px 0;border-color:var(--line);width:45px;height:45px}.ks{grid-template-columns:repeat(7,44px)}
.bt{font-weight:600}
</style>
</helmet>
<div class="b">

<div class="f"><div class="top"><div class="hd"><span class="ttl">Equation</span><button class="bt sm">Settings</button></div><div class="fd"><div class="eq"><i>x</i>&nbsp;=&nbsp;<span class="fr"><span>−<i>b</i> ± √<span class="ov"><i>b</i>² − 4<i>ac</i></span></span><span>2<i>a</i></span></span></div></div><div class="ac"><button class="bt pr">Copy LaTeX</button><button class="bt">Copy MathML</button><button class="bt">Speak</button></div></div><div class="tb"><button class="t on">Symbols</button><button class="t">Draw</button><button class="t">Library</button><button class="t">Shortcuts</button></div><div class="bd"><input class="in" aria-label="Find a symbol" placeholder="Find a symbol"><div class="cats"><button class="ct on">Recent</button><button class="ct">Layout</button><button class="ct">Operators</button><button class="ct">Greek</button><button class="ct">More</button></div><div class="ks"><button class="k">½</button><button class="k">√</button><button class="k">xⁿ</button><button class="k">xₙ</button><button class="k">π</button><button class="k">×</button><button class="k">≤</button><button class="k">≥</button><button class="k">∑</button><button class="k">∫</button><button class="k">∞</button><button class="k">≠</button><button class="k">±</button><button class="k">÷</button><button class="k">α</button><button class="k">β</button><button class="k">θ</button><button class="k">λ</button><button class="k">∈</button><button class="k">→</button><button class="k">∂</button></div></div></div>

<div class="f"><div class="top"><div class="hd"><span class="ttl">Equation</span><button class="bt sm">Settings</button></div><div class="fd"><div class="eq"><i>x</i>&nbsp;=&nbsp;<span class="fr"><span>−<i>b</i> ± √<span class="ov"><i>b</i>² − 4<i>ac</i></span></span><span>2<i>a</i></span></span></div></div><div class="ac"><button class="bt pr">Copy LaTeX</button><button class="bt">Copy MathML</button><button class="bt">Speak</button></div><div class="dn"><span class="h">Copied as LaTeX.</span> Paste it into your document.</div></div><div class="tb"><button class="t">Symbols</button><button class="t">Draw</button><button class="t on">Library</button><button class="t">Shortcuts</button></div><div class="bd"><button class="bt">Save this equation</button><input class="in" aria-label="Filter library" placeholder="Filter library"><div class="sv"><div class="svt"><div class="h">Euler's identity</div><span class="mm"><i>e</i><sup><i>iπ</i></sup> + 1 = 0</span></div><button class="bt">Insert</button></div><div class="sv"><div class="svt"><div class="h">Pythagoras</div><span class="mm"><i>a</i>² + <i>b</i>² = <i>c</i>²</span></div><button class="bt">Insert</button></div></div></div>

<div class="f w"><div class="top wl"><div class="hd"><span class="ttl">Equation</span><button class="bt sm">Settings</button></div><div class="fd big"><div class="eq"><i>x</i>&nbsp;=&nbsp;<span class="fr"><span>−<i>b</i> ± √<span class="ov"><i>b</i>² − 4<i>ac</i></span></span><span>2<i>a</i></span></span></div></div><div class="ac"><button class="bt pr">Copy LaTeX</button><button class="bt">Copy MathML</button><button class="bt">Speak</button></div><label class="lb" for="src">LaTeX source</label><input class="in src" id="src" value="x=\frac{-b\pm\sqrt{b^2-4ac}}{2a}"></div><div class="side"><div class="tb"><button class="t on">Symbols</button><button class="t">Draw</button><button class="t">Library</button><button class="t">Shortcuts</button></div><div class="bd"><input class="in" aria-label="Find a symbol" placeholder="Find a symbol"><div class="cats"><button class="ct on">Recent</button><button class="ct">Layout</button><button class="ct">Operators</button><button class="ct">Greek</button><button class="ct">More</button></div><div class="ks"><button class="k">½</button><button class="k">√</button><button class="k">xⁿ</button><button class="k">xₙ</button><button class="k">π</button><button class="k">×</button><button class="k">≤</button><button class="k">≥</button><button class="k">∑</button><button class="k">∫</button><button class="k">∞</button><button class="k">≠</button><button class="k">±</button><button class="k">÷</button><button class="k">α</button><button class="k">β</button><button class="k">θ</button><button class="k">λ</button><button class="k">∈</button><button class="k">→</button><button class="k">∂</button></div></div></div></div>

</div>
</x-dc>

</body>
</html>
